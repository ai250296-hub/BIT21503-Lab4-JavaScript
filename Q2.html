<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Question 2</title>
</head>
<body>

    <input type="text" id="userInput" placeholder="Enter a number">
    <button onclick="checkInput()">Check</button>

    <script>
        function checkInput() {
            let inputVal = document.getElementById("userInput").value;

            // Check if input is empty or not a valid number
            if (inputVal.trim() === "" || isNaN(inputVal)) {
                alert("Please insert a number!");
            } else {
                let num = Number(inputVal);

                if (num < 10) {
                    alert("The number is lower than 10");
                } else if (num > 10) {
                    alert("The number is higher than 10");
                } else {
                    alert("The number is equal to 10");
                }
            }
        }
    </script>

</body>
</html>
