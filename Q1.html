<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Question 1</title>
</head>
<body>

    <div id="myElement">
        <p id="welcomeText">Welcome to my website!</p>
    </div>

    <script>
        // Automatically change the paragraph text when the page loads
        window.onload = function() {
            document.getElementById("welcomeText").innerText = "Hello there!";
        };
    </script>

</body>
</html>
